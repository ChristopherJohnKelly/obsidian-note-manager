name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install -e packages/shared
          pip install -r apps/vault_worker/requirements.txt
          pip install -e apps/copilot_ui

      - name: Run tests
        run: |
          python3 -m pytest --cov=apps --cov=packages --cov-fail-under=90
